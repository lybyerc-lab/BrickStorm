<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>BrickStorm - LEGO: Twister</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: white;
	background-color: #12181c;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status {
	top: 0;
	bottom: 0;
	background-color: #1a2228;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
}

#status-progress {
	bottom: 15%;
	width: 60%;
	margin: 0 auto;
	height: 12px;
}

#status-title {
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	font-size: 28px;
	font-weight: bold;
	color: #f5c400;
	margin-bottom: 8px;
	text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
}

#status-subtitle {
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	font-size: 16px;
	color: #92b8d0;
	margin-bottom: 24px;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: sans-serif;
	line-height: 1.3;
	margin: 1rem 2rem;
	padding: 1rem;
	text-align: center;
}
		</style>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support HTML5 WebGL canvas.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-title">🌪️ BRICKSTORM: LEGO TWISTER</div>
			<div id="status-subtitle">Loading Oklahoma farmstead...</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="godot.js"></script>
		<script>
const GODOT_CONFIG = {
	"args": [],
	"canvasResizePolicy": 2,
	"ensureCrossOriginIsolationHeaders": false,
	"executable": "godot",
	"experimentalVK": false,
	"fileSizes": {},
	"focusCanvasOnStart": true,
	"gdextensionLibs": [],
	"mainPack": "game.pck"
};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;

	function setStatusMode(mode) {
		if (!initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
	}

	function displayFailureNotice(err) {
		console.error(err);
		statusNotice.textContent = (err instanceof Error) ? err.message : String(err);
		statusNotice.style.display = 'block';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: false });
	if (missing.length !== 0) {
		displayFailureNotice('Missing Web features: ' + missing.join(', '));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
