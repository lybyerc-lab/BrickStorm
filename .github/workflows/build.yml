name: Build

# Produces a playable web build and an Android APK on every push to the Claude
# branch. The APK is built here rather than locally because the development
# container cannot reach dl.google.com for the Android SDK.

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64

          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp tpz/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Add Godot to PATH
        run: |
          echo "GODOT=$HOME/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          "$GODOT" --headless --path . --import 2>&1 | tail -5

      # Structural gate: the anchor registry and the source must agree.
      # This proves nothing about behaviour - see Docs/NO_DRIFT_POLICY.md.
      - name: Verify code anchors
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --script res://tools/verify_anchors.gd 2>&1 | tee anchors.log
          grep -q "ANCHORS OK" anchors.log

      # The load-bearing gate: the core loop must actually run, not merely compile.
      - name: Self-test (core loop)
        run: |
          set -o pipefail
          "$GODOT" --headless --path . -- --selftest 2>&1 | tee selftest.log | grep -E "SELFTEST"
          grep -q "SELFTEST OK" selftest.log

      # How many hits a prop takes is a GAME PACING number, and it used to be
      # an accident of how each model happened to be subdivided: max_count was
      # ten bricks, more than any small prop contains, so everything came apart
      # in one hit. Rebuilding the smashables from round parts then halved the
      # measured SMASH rate without anyone touching the smash. This asserts
      # every smashable takes at least three hits AND that the number does not
      # move when a prop is rebuilt at a different granularity.
      - name: Smash probe (a smash takes a bite, not a prop)
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --script res://tools/smash_probe.gd 2>&1 \
            | tee smash.log | grep -E "hits|SMASHPROBE|FAIL"
          grep -q "SMASHPROBE OK" smash.log

      # The probe renders for real, so it needs a display. Everything else in
      # this job is headless.
      #
      # Do NOT reach for apt unless the display is actually missing. The runner
      # image ships third-party apt repositories we have nothing to do with,
      # and one of them (Google Chrome) served a bad index on 2026-09-09,
      # failing `apt-get update` with exit 100 and taking the whole build with
      # it. An unrelated repository must not be able to break this.
      - name: Ensure a display for the wind probe
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "xvfb-run already present"
          else
            sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* || true
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi

      # The wind is a VERTEX shader: it runs on the GPU and --selftest, which is
      # headless, cannot see whether anything actually moved. This renders a
      # tree and a barn side by side and measures how far each silhouette
      # sweeps. Without it "the trees move" is an assertion about source code.
      - name: Wind probe (foliage actually moves)
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 900x600x24" "$GODOT" --path . --resolution 900x600 \
            --script res://tools/wind_probe.gd 2>&1 | tee wind.log | grep -E "WINDPROBE"
          grep -q "WINDPROBE OK" wind.log

      # Back-face culling is a RENDERER behaviour, so headless cannot see it.
      # Every generated mesh in this game was wound inside-out for weeks - the
      # camera drew the far surface of every brick - and the self-test passed
      # throughout, because its winding assertion had the condition inverted.
      # This probe asks the renderer instead: it draws one quad wound each way
      # and reports which survives culling, then puts a marker inside a real
      # brick to show it is not see-through.
      - name: Winding probe (parts are not inside-out)
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 900x600x24" "$GODOT" --path . --resolution 900x600 \
            --script res://tools/winding_probe.gd 2>&1 | tee winding.log \
            | grep -E "WINDING RESULT|OCCLUSION RESULT"
          grep -q "WINDING RESULT: OK" winding.log
          grep -q "OCCLUSION RESULT: OK" winding.log

      # Measures every part in the library - triangle count, bounds, enclosed
      # volume, and the winding of each triangle against its own normal - and
      # asserts the brick still matches the hand-written mesh the generic
      # builder replaced. Also does the rendered half of the tear-mapping
      # check, which headless Godot cannot do: it returns identity for every
      # MultiMesh instance transform, so a read-back test there always passes.
      - name: Part probe (part meshes and tear mapping)
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 900x600x24" "$GODOT" --path . --resolution 900x600 \
            --script res://tools/part_probe.gd 2>&1 | tee parts.log \
            | grep -E "PARTPROBE|golden|TEAR|FAIL"
          grep -q "PARTPROBE OK" parts.log

      # A scene can build perfectly - right structure count, right part count,
      # every bound inside its slot - and still draw nothing, if the geometry
      # ends up behind the camera or under the ground. --selftest cannot see
      # that, because it never renders. This differences each scene's road view
      # against an empty frame of the same ground, having first proved the
      # comparator itself by differencing two empty frames.
      - name: Scene probe (the set pieces actually draw)
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . --resolution 1280x720 \
            --script res://tools/scene_probe.gd 2>&1 | tee scenes.log \
            | grep -E "comparator|scene |SCENEPROBE|FAIL"
          grep -q "SCENEPROBE OK" scenes.log

      # A smash that moves bricks but not the character reads as a dropped
      # input. Nothing headless can see it - the tear is correct, the score
      # goes up, the gate passes - so this renders the swing and measures how
      # far the arms actually sweep, through Player's own curve rather than a
      # retyped copy of it.
      - name: Swing probe (the smash shows on the minifig)
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 900x600x24" "$GODOT" --path . --resolution 900x600 \
            --script res://tools/swing_probe.gd 2>&1 | tee swing.log \
            | grep -E "SWINGPROBE"
          grep -q "SWINGPROBE OK" swing.log

      - name: Export Web
        run: |
          mkdir -p build/web
          "$GODOT" --headless --path . --export-release "Web" build/web/index.html 2>&1 | tail -3
          ls -la build/web

      - name: Set up debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Point Godot at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using Android SDK at $SDK"
          cat > ~/.config/godot/editor_settings-4.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES

      - name: Export Android APK
        run: |
          mkdir -p build/android
          "$GODOT" --headless --path . --export-debug "Android" build/android/brickstorm.apk 2>&1 | tail -20
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: brickstorm-web
          path: build/web

      - uses: actions/upload-artifact@v4
        with:
          name: brickstorm-apk
          path: build/android/*.apk
          if-no-files-found: warn
